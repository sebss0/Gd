
name: Build Infinite Wave APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Infinite Wave
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          test -f InfiniteWave_GitHub_Build.zip
          mkdir -p project
          unzip -oq InfiniteWave_GitHub_Build.zip -d project

      - name: Localizar proyecto Gradle
        run: |
          PROJECT_DIR=$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find project -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             output/InfiniteWave.apk

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteWave-APK
          path: output/InfiniteWave.apk
          if-no-files-found: error
          retention-days: 14
